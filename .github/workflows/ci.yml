name: CI rápido

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, testes, build e auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint sem avisos
        run: npx eslint . --max-warnings=0

      - name: TypeScript
        run: npx tsc -b --pretty false

      - name: Testes unitários
        run: npm test
        env:
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Dependências de produção
        run: npm audit --omit=dev
